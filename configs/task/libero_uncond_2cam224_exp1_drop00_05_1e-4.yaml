# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: bridgewam
  - _self_

# Experiment A: Video DiT remains intact, while Action queries cannot read
# Video K/V in MoT layers [0, 5) during either training or inference.
model:
  mot_checkpoint_mixed_attn: false
  action_video_kv_routing:
    enabled: true
    keep_layers: null
    keep_layer_start: null
    keep_layer_end: null
    drop_layers: null
    drop_layer_start: 0
    drop_layer_end: 5

# Match the official LIBERO post-training recipe.
batch_size: 16
num_workers: 8
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
